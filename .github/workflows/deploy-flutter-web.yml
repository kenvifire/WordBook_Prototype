name: Deploy Flutter Web

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/deploy-flutter-web.yml'
  workflow_dispatch: {}

defaults:
  run:
    working-directory: flutter_app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
      - run: flutter pub get
      - run: flutter build web --release

      - name: Deploy to production
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H proxy.itluobo.com >> ~/.ssh/known_hosts 2>/dev/null
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o BatchMode=yes" \
            build/web/ root@proxy.itluobo.com:/var/www/wb/
